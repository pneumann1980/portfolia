youtube:
  # Kanal-Abos über RSS (ohne API-Key). Handles werden beim Start zur Channel-ID aufgelöst; nicht
  # auflösbare Handles werden deaktiviert und gemeldet – nie geraten oder still ersetzt.
  channels:
    # Krypto/Makro (en)
    - {handle: "@CoinBureau", group: "Krypto/Makro", language: en, weight: 0.6, active: true}
    - {handle: "@RaoulPalTJM", group: "Krypto/Makro", language: en, weight: 0.6, active: true}
    - {handle: "@RealVisionFinance", group: "Krypto/Makro", language: en, weight: 0.6, active: true}
    - {handle: "@intothecryptoverse", group: "Krypto/Makro", language: en, weight: 0.6, active: true}
    - {handle: "@Bankless", group: "Krypto/Makro", language: en, weight: 0.6, active: true}
    - {handle: "@AnthonyPompliano", group: "Krypto/Makro", language: en, weight: 0.6, active: true}
    # Finanzen/Märkte (en)
    - {handle: "@markets", group: "Märkte", language: en, weight: 0.6, active: true}
    - {handle: "@CNBCtelevision", group: "Märkte", language: en, weight: 0.6, active: true}
    - {handle: "@YahooFinance", group: "Märkte", language: en, weight: 0.6, active: true}
    # Deutsch
    - {handle: "@Finanzfluss", group: "Deutsch", language: de, weight: 0.6, active: true}
    - {handle: "@MissionMoney", group: "Deutsch", language: de, weight: 0.6, active: true}
    - {handle: "@DerAktionaerTV", group: "Deutsch", language: de, weight: 0.6, active: true}
    - {handle: "@Blocktrainer", group: "Deutsch", language: de, weight: 0.6, active: true}
    # Unternehmenskanäle gehaltener Aktien (Primärquelle, Zuordnung zum Asset per 'assets')
    - {handle: "@palantirtech", group: "Unternehmen", language: en, weight: 1.0, active: true, assets: ["WKN:A2QA4J"]}
  discovery:
    enabled: true              # wirkt nur mit YOUTUBE_API_KEY
    top_n_positions: 10
    min_subscribers: 100000
    min_views: 5000
    published_within_days: 7
    daily_unit_budget: 2500    # Suche = 100 Einheiten; Standardkontingent 10.000/Tag
    query_suffix_crypto: "crypto"
    query_suffix_security: "stock"
  # Entscheidungen aus der Oberfläche (werden von der App gepflegt)
  ignored_channels: []
  blocked_channels: []
