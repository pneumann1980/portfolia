# Portfolia – Quellen für News & Videos
#
# Diese Datei wird beim ersten Start nach /data/sources.yaml kopiert und danach NICHT mehr überschrieben.
# Du kannst jede Quelle aktivieren/deaktivieren (active), gewichten (weight) oder ergänzen.
# Entscheidungen zu YouTube-Vorschlägen (abonnieren/ignorieren/blockieren) schreibt die App hierher zurück.
#
# Verifikation: Beim Start und danach periodisch prüft Portfolia jede aktive Quelle. Nicht erreichbare
# Quellen werden automatisch pausiert und unter „Datenqualität → Datenquellen“ gemeldet – nie still gelöscht.
# Hinweis zur Erstellung: Die URLs/Handles unten entsprechen dem Stand der Konfiguration; in der
# Build-Umgebung war kein Internetzugriff auf diese Hosts möglich, daher erfolgt die Prüfung zur Laufzeit.
#
# Typen:
#   rss              – fester RSS/Atom-Feed (url)
#   rss_per_asset    – Feed je Asset (url_template mit {ticker} oder {query}); applies_to: security|crypto|all
#   finnhub          – Finnhub company-news (FINNHUB_API_KEY), je Aktie
#   cryptopanic      – CryptoPanic-API (CRYPTOPANIC_API_KEY), Währungsfilter = gehaltene Coins
#   binance_api      – Binance-Ankündigungen (öffentliche CMS-Schnittstelle, kein offizieller RSS)
#   bybit_api        – Bybit-Ankündigungen (offizielle v5-API)
# require_match: true → nur Meldungen behalten, die einem gehaltenen Asset zugeordnet werden können.

version: 1

settings:
  fetch_interval_minutes: 30
  retention_days: 90
  request_timeout_s: 20
  max_items_per_feed: 60
  languages: [de, en]
  per_asset_top_n: 40            # Feeds je Asset nur für die größten N Positionen (Last begrenzen)
  shorts_hidden: true
  # Reißerische Titelmuster (Groß-/Kleinschreibung egal) → ausgeblendet
  title_blocklist:
    - "100x"
    - "1000x"
    - "guaranteed"
    - "garantiert"
    - "last chance"
    - "letzte chance"
    - "millionaire"
    - "millionär"
    - "get rich"
    - "to the moon"
    - "must buy"
    - "going to explode"
    - "explodiert gleich"
  # Kontextwörter, die bei mehrdeutigen Kürzeln zusätzlich vorkommen müssen
  context_words: [crypto, krypto, kryptowährung, cryptocurrency, coin, token, blockchain, altcoin, staking, mainnet,
                  wallet, defi, airdrop, exchange, börse, kurs, price, btc, eth]
  # Mehrdeutige Kürzel/Namen: Treffer zählen nur mit Kontextwort (oder zusätzlichem eindeutigem Alias)
  ambiguous_terms: [SUI, TAP, PI, NIGHT, ONE, NEAR, GAS, SAND, FLOW, LINK, DOT, OP, ARB, APT, ADA, ATOM, CAKE,
                    GALA, HOT, MASK, STX, TIA, ALGO, ROSE, SOL, UNI, SEI, TON, KAS, JUP, WIF, POL, ETC, FET, VET,
                    RAY, MINA, PEPE, BONK, S, ON, T, F, A]
  # Ausschlussmuster je Asset-Kürzel (Regex, Groß-/Kleinschreibung egal)
  exclude_patterns:
    SUI: ["sui generis"]
    PI: ["raspberry pi", "\\bpi day\\b", "\\bπ\\b"]
    NIGHT: ["good night", "night shift", "overnight"]
    ONE: ["\\bone of\\b", "\\bno one\\b"]
    LINK: ["\\blink in bio\\b"]
  # Standardgewichte (Quellen können eigene Gewichte setzen)
  default_weights:
    primary: 1.0        # Unternehmens- und Projektquellen
    agency: 0.8         # Nachrichtenagenturen, große Portale
    crypto_portal: 0.7  # Krypto-Fachportale
    youtube: 0.6        # abonnierte YouTube-Kanäle
    discovered: 0.4     # über Entdeckung gefundene Kanäle (bis zur Bestätigung)

sources:
  # ---- Aktien / alle Assets: Feeds je Asset --------------------------------------------------------
  - id: yahoo_ticker
    name: Yahoo Finance (Ticker)
    type: rss_per_asset
    applies_to: security
    url_template: "https://feeds.finance.yahoo.com/rss/2.0/headline?s={ticker}&region=US&lang=en-US"
    weight: 0.8
    language: en
    active: true
  - id: google_news_de
    name: Google News (de)
    type: rss_per_asset
    applies_to: all
    url_template: "https://news.google.com/rss/search?q={query}&hl=de&gl=DE&ceid=DE:de"
    weight: 0.8
    language: de
    active: true
  - id: google_news_en
    name: Google News (en)
    type: rss_per_asset
    applies_to: all
    url_template: "https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en"
    weight: 0.8
    language: en
    active: true
  - id: finnhub
    name: Finnhub Company News
    type: finnhub
    applies_to: security
    weight: 0.8
    language: en
    active: true            # wirkt nur mit FINNHUB_API_KEY

