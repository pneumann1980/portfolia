[project]
name = "portfolia"
version = "0.96.0"
description = "Self-hosted Portfolio-Dashboard (Aktien & Krypto) für Unraid/Docker – nur lesend, EUR-basiert, mit Steuer-Modul."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "S", "DTZ011", "DTZ002"]
ignore = [
  "S311",   # pseudo-random generators are fine for demo data
  "S608",   # SQL built from constant fragments only (placeholders for values)
  "RUF001", "RUF002", "RUF003",  # German typography (–, „“) is intentional
  "SIM108",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
# Externe Soll-Fälle der Gesamtprüfung 0.94.2 – unverändert übernommen (Fixture-Importe, Formatierung des Prüfers)
"tests/external_095/*" = ["S", "B", "F401", "F811", "F841", "I001", "E501", "RUF059", "RUF100"]
# Externe Gegenproben der Nachprüfung 0.95.0 – unverändert übernommen
"tests/external_096/*" = ["S", "B", "F401", "F811", "F841", "I001", "E501", "RUF059", "RUF100"]
"scripts/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:feedparser.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
