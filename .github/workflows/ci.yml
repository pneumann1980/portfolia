name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Texterkennung (Tesseract) für die Beleg-Tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests scripts
      - name: Tests (inkl. Großimport und Datenschutz)
        env:
          TZ: Europe/Berlin
        run: pytest -q
      - name: Beispiel-Import validieren
        run: python -m app validate examples/beispiel-import.zip

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Metadaten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Anmeldung GHCR
        if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (und Push auf main/Tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Commit im Image: in der App (Einstellungen → System, Seitenleiste) und unter /healthz sichtbar
          build-args: PORTFOLIA_REVISION=${{ github.sha }}
          # Docker-Manifestliste statt OCI-Index (BuildKit-Standard, mit Attestierungen sogar zwingend);
          # sonst meldet die Update-Prüfung von Unraid (fragt Docker-Manifesttypen an) „not available“
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Manifest-Format prüfen (Unraid-Update-Prüfung)
        if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          mt=$(docker buildx imagetools inspect --raw "$ref" | python3 -c "import json, sys; print(json.load(sys.stdin)['mediaType'])")
          echo "$ref: $mt"
          test "$mt" = "application/vnd.docker.distribution.manifest.list.v2+json"
      - name: Veröffentlichte Tags
        if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "Commit ${GITHUB_SHA} veröffentlicht als:"
          echo "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}" | head -3
      - name: Smoke-Test (amd64)
        run: |
          docker buildx build --load --platform linux/amd64 --build-arg PORTFOLIA_REVISION=${GITHUB_SHA} -t portfolia:ci .
          size=$(docker image inspect portfolia:ci --format '{{.Size}}')
          echo "Image-Größe: $((size / 1024 / 1024)) MB"
          echo "::notice title=Image-Größe amd64 entpackt::$((size / 1024 / 1024)) MiB"
          # Grenze 450 MiB: seit M25 inkl. Tesseract (≈ 80 MB entpackt, davon libicu72 ≈ 36 MB)
          test "$size" -lt 471859200
          # native Erweiterungen laden (fängt beschädigte Bibliotheken ab, auch wenn die App sie erst später braucht)
          docker run --rm --entrypoint python portfolia:ci -c \
            "import numpy, pandas, lxml.etree, PIL.Image, curl_cffi, bcrypt, reportlab.pdfgen.canvas, yfinance, pypdfium2; print('native ok')"
          # Belegimport: Tesseract mit Deutsch/Englisch, PDF-Text und OCR im isolierten Kindprozess (synthetischer Beleg)
          docker run --rm --entrypoint tesseract portfolia:ci --list-langs | grep -qx deu
          python3 -c "import sys; sys.path.insert(0, '.'); from tests.docfixtures import text_pdf; open('ci-beleg.pdf', 'wb').write(text_pdf(['Musterbank AG', 'Wertpapierabrechnung Kauf', 'Handelstag  02.01.2025', 'ISIN  DE0007164600  Stück  10', 'Kurs  123,45 EUR  Kurswert  1.234,50 EUR', 'Provision  4,90 EUR']))"
          mkdir -p ci-data ci-import ci-exports && cp examples/beispiel-import.zip ci-import/ && touch -d '1 hour ago' ci-import/beispiel-import.zip
          # Containernamen brauchen mindestens zwei Zeichen
          docker run -d --name portfolia-ci -e DEMO_MODE=true -e PUID=$(id -u) -e PGID=$(id -g) -p 8080:8080 \
            -e EXPORT_DIR=/exports -v "$PWD/ci-data:/data" -v "$PWD/ci-import:/import:ro" -v "$PWD/ci-exports:/exports" \
            portfolia:ci
          trap 'docker logs portfolia-ci 2>&1 | tail -30; docker rm -f portfolia-ci >/dev/null' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q "\"revision\":\"${GITHUB_SHA}\""
          curl -fsS http://127.0.0.1:8080/ | grep -q Portfolia
          curl -fsS -o /dev/null http://127.0.0.1:8080/plans
          curl -fsS http://127.0.0.1:8080/journal/csv | grep -q "CSV-Import"
          # Beleg hochladen (wie die Oberfläche: XHR mit CSRF-Kopfzeile) → Stapel läuft durch, nichts wird gebucht
          curl -fsS -c ci-cookies.txt -o /dev/null http://127.0.0.1:8080/journal/documents
          token=$(awk '$6 == "portfolia_csrf" {print $7}' ci-cookies.txt)
          target=$(curl -fsS -b ci-cookies.txt -H "X-CSRF-Token: $token" -H "X-Requested-With: XMLHttpRequest" \
            -F "files=@ci-beleg.pdf;type=application/pdf" http://127.0.0.1:8080/journal/documents/upload \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['redirect'])")
          echo "Stapel: $target"
          for i in $(seq 1 30); do curl -fsS "http://127.0.0.1:8080${target%%\?*}" | grep -q "Prüf-Stapel #" && break; sleep 2; done
          curl -fsS "http://127.0.0.1:8080${target%%\?*}" | grep -q "Prüf-Stapel #"
          curl -fsS http://127.0.0.1:8080/journal/documents | grep -q "im Prüf-Stapel"
          # der Import wird mit Datum archiviert (Exportverzeichnis außerhalb von /data, Besitzrechte per PUID/PGID)
          for i in $(seq 1 30); do ls ci-exports/import-archiv/import-*.zip >/dev/null 2>&1 && break; sleep 2; done
          ls -l ci-exports/import-archiv/import-*.zip
