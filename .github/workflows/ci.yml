name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests scripts
      - name: Tests (inkl. Großimport und Datenschutz)
        env:
          TZ: Europe/Berlin
        run: pytest -q
      - name: Beispiel-Import validieren
        run: python -m app validate examples/beispiel-import.zip

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Metadaten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Anmeldung GHCR
        if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (und Push auf main/Tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-Test (amd64)
        run: |
          docker buildx build --load --platform linux/amd64 -t portfolia:ci .
          size=$(docker image inspect portfolia:ci --format '{{.Size}}')
          echo "Image-Größe: $((size / 1024 / 1024)) MB"
          test "$size" -lt 367001600
          mkdir -p ci-data ci-import && cp examples/beispiel-import.zip ci-import/ && touch -d '1 hour ago' ci-import/beispiel-import.zip
          docker run -d --name p -e DEMO_MODE=true -e PUID=$(id -u) -e PGID=$(id -g) -p 8080:8080 \
            -v "$PWD/ci-data:/data" -v "$PWD/ci-import:/import:ro" portfolia:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/ | grep -q Portfolia
          docker logs p | tail -20
          docker rm -f p
