name: Nightly

# Abdeckungsgrenze: der Volltest dauert ~20 Minuten, mit Messung länger – deshalb nachts statt bei jedem Push.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Texterkennung (Tesseract) für die Beleg-Tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Tests mit Abdeckung (Untergrenze 84 % der Zeilen, Stand 0.58.0 85,6 %)"
        env:
          TZ: Europe/Berlin
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=84
