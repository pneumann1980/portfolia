# Steuerparameter Deutschland (EStG / InvStG) für das Regelwerk "de".
#
# Aktualisierung ohne Programm-Update: /data/tax_rules/de.yaml mit derselben Struktur anlegen und nur
# geänderte Werte eintragen (wird tief gemischt; Fehler werden in der App angezeigt und der Override
# ignoriert). Beispiel für einen neuen Basiszins und eine verifizierte Formularzeile:
#
#   pack: {reviewed_through: 2027}
#   per_year:
#     basiszins: {2027: 0.0300}        # Beispielwert – amtlichen Wert des BMF eintragen
#   forms:
#     2026:
#       anlage_so: {fields: {so_23_gain: {line: "51"}}}
#
# Zeilennummern amtlicher Formulare ändern sich jährlich. Hinterlegt sind nur Zeilen, die für das jeweilige
# Jahr übereinstimmend belegt sind (Stand 27.09.2026 aus Sekundärquellen: Steuersoftware-Feldhilfen,
# Fachportale – die amtlichen Vordrucke waren nicht direkt abrufbar); alle anderen bleiben line: null und
# die Übertragungshilfe nennt nur die Feldbezeichnung. Vor der Abgabe mit dem amtlichen Vordruck abgleichen.

pack:
  id: de
  version: "2026.3"
  updated: "2026-10-25"
  reviewed_through: 2026
  sources:
    - "§ 23 Abs. 1 S. 1 Nr. 2, Abs. 3 S. 5 EStG (private Veräußerungsgeschäfte, Freigrenze)"
    - "§ 22 Nr. 3 EStG (Einkünfte aus Leistungen, Freigrenze 256 €)"
    - "§ 20, § 32d EStG (Kapitalerträge, Abgeltungsteuer, Verlustverrechnung Aktien)"
    - "§§ 16, 18, 19, 20 InvStG (Investmenterträge, Vorabpauschale, Teilfreistellung)"
    - "BMF-Schreiben zu Kryptowerten vom 10.05.2022 und 06.03.2025"
    - "BMF-Schreiben zum Basiszins für die Vorabpauschale (jährlich)"

# Werte gelten ab dem angegebenen Veranlagungsjahr, bis ein späteres Jahr sie ändert.
rules:
  2018:
    currency: EUR
    crypto:
      holding_period_years: 1        # § 23 Abs. 1 S. 1 Nr. 2 EStG
      exempt_after_holding: true     # Schalter: false = auch nach Ablauf der Haltefrist steuerpflichtig (Gesetzesänderung)
      freigrenze_mode: freigrenze    # Schalter: freigrenze (alles oder nichts) | freibetrag (nur der übersteigende Teil)
      freigrenze_23: 600             # § 23 Abs. 3 S. 5 EStG (bis VZ 2023)
      freigrenze_22_3: 256           # § 22 Nr. 3 S. 2 EStG
    capital:
      flat_rate: 0.25                # § 32d Abs. 1 EStG
      soli_rate: 0.055
      sparer_pauschbetrag_single: 801
      sparer_pauschbetrag_joint: 1602
      vp_factor: 0.7                 # § 18 Abs. 1 InvStG: 70 % des Basiszinses
      wht_credit_cap: 0.15           # anrechenbare Quellensteuer im DBA-Regelfall
      derivative_loss_cap: null      # Verrechnungsgrenze Verluste aus Termingeschäften (null = keine); 20.000 € in 2021–2023
      teilfreistellung:              # § 20 InvStG (Privatvermögen)
        etf_equity: 0.30
        etf_mixed: 0.15
        fund_realestate: 0.60
        fund_realestate_foreign: 0.80
        etf_other: 0.0
  2021:
    capital:
      derivative_loss_cap: 20000         # § 20 Abs. 6 S. 5 EStG a. F. (JStG 2020), Verluste ab 2021
  2023:
    capital:
      sparer_pauschbetrag_single: 1000   # § 20 Abs. 9 EStG ab VZ 2023
      sparer_pauschbetrag_joint: 2000
  2024:
    capital:
      derivative_loss_cap: null          # JStG 2024: Verrechnungsgrenze aufgehoben
    crypto:
      freigrenze_23: 1000            # ab VZ 2024

# Werte nur für genau das angegebene Jahr (keine Fortschreibung).
per_year:
  # Basiszins zur Berechnung der Vorabpauschale des Kalenderjahres (BMF). Negative Werte → keine
  # Vorabpauschale. Die Vorabpauschale eines Jahres gilt am ersten Werktag des Folgejahres als zugeflossen.
  basiszins:
    2018: 0.0087
    2019: 0.0052
    2020: 0.0007
    2021: -0.0045
    2022: -0.0005
    2023: 0.0255
    2024: 0.0229
    2025: 0.0253
    2026: 0.0320   # BMF-Schreiben vom 13.01.2026 (IV C 1 - S 1980/00230/012/001) – Vorabpauschale 2026, Zufluss 2.1.2027
    # 2027: nach Veröffentlichung durch das BMF (Januar 2027) im Override eintragen

forms:
  default:
    anlage_so:
      title: "Anlage SO"
      fields:
        so_23_desc: {section: "Private Veräußerungsgeschäfte – andere Wirtschaftsgüter", label: "Bezeichnung des Wirtschaftsguts", line: null}
        so_23_acq: {section: "Private Veräußerungsgeschäfte – andere Wirtschaftsgüter", label: "Zeitpunkt der Anschaffung", line: null}
        so_23_disp: {section: "Private Veräußerungsgeschäfte – andere Wirtschaftsgüter", label: "Zeitpunkt der Veräußerung", line: null}
        so_23_price: {section: "Private Veräußerungsgeschäfte – andere Wirtschaftsgüter", label: "Veräußerungspreis oder an dessen Stelle tretender Wert", line: null}
        so_23_cost: {section: "Private Veräußerungsgeschäfte – andere Wirtschaftsgüter", label: "Anschaffungskosten", line: null}
        so_23_wk: {section: "Private Veräußerungsgeschäfte – andere Wirtschaftsgüter", label: "Werbungskosten", line: null}
        so_23_gain: {section: "Private Veräußerungsgeschäfte – andere Wirtschaftsgüter", label: "Gewinn / Verlust", line: null}
        so_22_3_desc: {section: "Einkünfte aus Leistungen (§ 22 Nr. 3 EStG)", label: "Art der Leistung", line: null}
        so_22_3_income: {section: "Einkünfte aus Leistungen (§ 22 Nr. 3 EStG)", label: "Einnahmen", line: null}
        so_22_3_wk: {section: "Einkünfte aus Leistungen (§ 22 Nr. 3 EStG)", label: "Werbungskosten", line: null}
    anlage_kap:
      title: "Anlage KAP"
      fields:
        kap_foreign_total: {section: "Kapitalerträge, die nicht dem inländischen Steuerabzug unterlegen haben", label: "Ausländische Kapitalerträge (ohne Investmenterträge)", line: null}
        kap_foreign_share_gains: {section: "Kapitalerträge, die nicht dem inländischen Steuerabzug unterlegen haben", label: "darin enthaltene Gewinne aus Aktienveräußerungen i. S. d. § 20 Abs. 2 S. 1 Nr. 1 EStG", line: null}
        kap_foreign_losses_other: {section: "Kapitalerträge, die nicht dem inländischen Steuerabzug unterlegen haben", label: "darin enthaltene Verluste ohne Verluste aus der Veräußerung von Aktien", line: null}
        kap_foreign_losses_shares: {section: "Kapitalerträge, die nicht dem inländischen Steuerabzug unterlegen haben", label: "darin enthaltene Verluste aus der Veräußerung von Aktien i. S. d. § 20 Abs. 2 S. 1 Nr. 1 EStG", line: null}
        kap_wht: {section: "Anrechenbare ausländische Steuern", label: "Anrechenbare noch nicht angerechnete ausländische Steuern", line: null}
        # Kontrollwerte für Depots mit inländischem Steuerabzug (maßgeblich ist die Steuerbescheinigung der Bank)
        kap_dom_total: {section: "Kapitalerträge mit inländischem Steuerabzug – Kontrollwerte", label: "Höhe der Kapitalerträge", line: null}
        kap_dom_share_gains: {section: "Kapitalerträge mit inländischem Steuerabzug – Kontrollwerte", label: "davon Gewinne aus Aktienveräußerungen", line: null}
        kap_dom_pauschbetrag: {section: "Kapitalerträge mit inländischem Steuerabzug – Kontrollwerte", label: "in Anspruch genommener Sparer-Pauschbetrag", line: null}
        kap_dom_kest: {section: "Kapitalerträge mit inländischem Steuerabzug – Kontrollwerte", label: "Einbehaltene Kapitalertragsteuer", line: null}
        kap_dom_soli: {section: "Kapitalerträge mit inländischem Steuerabzug – Kontrollwerte", label: "Einbehaltener Solidaritätszuschlag", line: null}
        kap_dom_wht: {section: "Kapitalerträge mit inländischem Steuerabzug – Kontrollwerte", label: "Summe der angerechneten ausländischen Steuer", line: null}
    anlage_kap_inv:
      title: "Anlage KAP-INV"
      fund_labels:
        etf_equity: "Aktienfonds"
        etf_mixed: "Mischfonds"
        fund_realestate: "Immobilienfonds"
        fund_realestate_foreign: "Auslands-Immobilienfonds"
        etf_other: "Sonstige Investmentfonds"
      fields:
        # lines: Zeile je Fondsart (etf_equity, etf_mixed, fund_realestate, fund_realestate_foreign, etf_other)
        inv_dist: {section: "Investmenterträge ohne inländischen Steuerabzug – Ausschüttungen", label: "Ausschüttungen", line: null, lines: {}}
        inv_vp: {section: "Investmenterträge ohne inländischen Steuerabzug – Vorabpauschalen", label: "Vorabpauschalen", line: null, lines: {}}
        inv_gain: {section: "Investmenterträge ohne inländischen Steuerabzug – Veräußerungen", label: "Gewinne / Verluste aus der Veräußerung (vor Teilfreistellung)", line: null, lines: {}}

  # Veranlagungsjahr 2024 – Zeilen laut Anlage SO/KAP/KAP-INV 2024 (übereinstimmend in mehreren Quellen)
  2024:
    anlage_so:
      fields:
        # Abschnitt „andere Wirtschaftsgüter“; Zeile 41 = Kennzeichen „Kryptowährungen“
        so_23_desc: {line: "42"}
        so_23_acq: {line: "43"}
        so_23_disp: {line: "43"}
        so_23_price: {line: "44"}
        so_23_cost: {line: "45"}
        so_23_wk: {line: "46"}
        so_23_gain: {line: "47"}
    anlage_kap:
      fields:
        kap_foreign_total: {line: "19"}
        kap_foreign_share_gains: {line: "20"}
        kap_foreign_losses_other: {line: "22"}
        kap_foreign_losses_shares: {line: "23"}
        kap_wht: {line: "41"}
    anlage_kap_inv:
      fields:
        inv_dist: {lines: {etf_equity: "4", etf_mixed: "5", fund_realestate: "6", fund_realestate_foreign: "7", etf_other: "8"}}
        inv_vp: {lines: {etf_equity: "9", etf_mixed: "10", fund_realestate: "11", fund_realestate_foreign: "12", etf_other: "13"}}

  # Veranlagungsjahr 2025 – Anlage SO mit eigenem Abschnitt für Kryptowerte (Zeilen 45–51). Anlage KAP und
  # KAP-INV wurden 2025 umgebaut (u. a. Wegfall der Zeilen zu Termingeschäften); die Quellen zu den neuen
  # Zeilennummern der Auslandsfelder widersprechen sich – daher bewusst nicht hinterlegt. Belegt (Steuerbescheinigung
  # der DKB für 2025 auf dem amtlichen Muster, Stand 25.10.2026): Zeile 7 Kapitalerträge, 8 davon Aktiengewinne, 16/17
  # Sparer-Pauschbetrag, 37 Kapitalertragsteuer, 38 Solidaritätszuschlag, 40 angerechnete ausländische Steuer; in den
  # Erläuterungen derselben Bescheinigung: Zeile 41 (noch nicht angerechnete ausländische Steuer), 42 (fiktive
  # Quellensteuer). Die Auslandsfelder (Zeilen 19–23) sind für 2025 weiter offen.
  2025:
    anlage_so:
      fields:
        so_23_desc: {section: "Private Veräußerungsgeschäfte – Kryptowerte"}
        so_23_acq: {section: "Private Veräußerungsgeschäfte – Kryptowerte"}
        so_23_disp: {section: "Private Veräußerungsgeschäfte – Kryptowerte"}
        so_23_price: {section: "Private Veräußerungsgeschäfte – Kryptowerte", line: "48"}
        so_23_cost: {section: "Private Veräußerungsgeschäfte – Kryptowerte", line: "49"}
        so_23_wk: {section: "Private Veräußerungsgeschäfte – Kryptowerte", line: "50"}
        so_23_gain: {section: "Private Veräußerungsgeschäfte – Kryptowerte", line: "51"}
    anlage_kap:
      fields:
        kap_wht: {line: "41"}
        kap_dom_total: {line: "7"}
        kap_dom_share_gains: {line: "8"}
        kap_dom_pauschbetrag: {line: "16/17"}
        kap_dom_kest: {line: "37"}
        kap_dom_soli: {line: "38"}
        kap_dom_wht: {line: "40"}
